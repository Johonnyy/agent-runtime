[project]
name = "agent-runtime"
version = "0.1.0"
description = "The shared agentic loop — call model, execute tools, feed results back, repeat. Streaming and cost tracking included."
requires-python = ">=3.11"
dependencies = [
    # OpenRouter speaks the OpenAI wire protocol, so the standard client is all we
    # need. Deliberately not OpenRouter's own Agent SDK (beta, TypeScript-first).
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Remote tool execution over MCP. Optional because the runtime is perfectly usable
# with in-process tools (LocalToolBroker) or none at all.
#
# v2, not v1: the client API changed outright. `streamablehttp_client` is gone,
# its replacement takes no `headers=` (so the depth-guard headers now travel via a
# caller-owned httpx2 client), and Python attributes went snake_case while the wire
# stayed camelCase. `mcp>=1.2` would resolve happily and then fail at the first
# remote call, which is the worst possible time to find out.
#
# The `agent-mcp-py` git pin joins this list once that repo publishes v0.1.0 — until
# then `mcp_client` falls back to its own signature-compatible copies of the depth
# constants and to an injected registry mapping.
mcp = ["mcp>=2.0,<3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
